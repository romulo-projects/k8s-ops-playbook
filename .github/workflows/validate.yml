name: Validate playbook
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validators
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Shell checks
        run: |
          for file in scripts/*.sh tests/*.sh cheatsheet/aliases.sh; do bash -n "$file"; done
          shellcheck -x scripts/*.sh tests/*.sh cheatsheet/aliases.sh
      - name: Offline regression tests
        run: bash tests/run.sh
